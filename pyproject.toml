[project]
name = "jarvis"
version = "0.1.0"
description = "Personal desktop intelligence: multi-provider LLM routing with tiered, audited computer control."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "openai>=3.0",
    "anthropic>=2.0",
    "httpx2>=2.0",
    "psutil>=6.1",
    "nvidia-ml-py>=12.560",
    "keyring>=25.5",
    "pywebview>=5.3",
    "pywin32>=308; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
    "playwright>=1.49",
    "mcp>=1.2",
    "send2trash>=1.8",
    "openwakeword>=0.6",
    "sounddevice>=0.5",
    "onnxruntime>=1.20",
    "faster-whisper>=1.1",
    "edge-tts>=6.1",
    "python-telegram-bot>=22.0",
    "mss>=9.0",
    "easyocr>=1.7",
    "nvidia-riva-client>=2.19",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
ignore = ["SIM102", "SIM117", "S110", "S112", "ASYNC230"]

[tool.uv]
# Jarvis runs on Windows and on Apple Silicon Macs. Leaving Linux out also skips openwakeword's Linux-only
# tflite-runtime, which has no Python 3.12 wheels (Jarvis uses the ONNX backend). Intel Macs are left out
# because PyTorch (pulled in by easyocr) no longer ships x86_64 macOS wheels.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
